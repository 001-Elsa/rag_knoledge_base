<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>运维管理 · 死信 / 隔离 / 审计</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --line: #2a3a4f;
      --text: #e7eef7;
      --muted: #8aa0b8;
      --accent: #3d8bfd;
      --danger: #e35d6a;
      --ok: #3dba7a;
      --warn: #d4a017;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1c2b44, var(--bg));
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 1.5rem 2rem 0.5rem;
      border-bottom: 1px solid var(--line);
    }
    header h1 { margin: 0; font-size: 1.35rem; letter-spacing: 0.02em; }
    header p { margin: 0.35rem 0 1rem; color: var(--muted); font-size: 0.9rem; }
    main { padding: 1.25rem 2rem 3rem; max-width: 1100px; }
    .bar {
      display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: end;
      margin-bottom: 1.25rem;
    }
    label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.8rem; color: var(--muted); }
    input, select, button, textarea {
      font: inherit; border-radius: 6px; border: 1px solid var(--line);
      background: var(--panel); color: var(--text); padding: 0.45rem 0.65rem;
    }
    button { cursor: pointer; background: var(--accent); border-color: transparent; color: #fff; }
    button.secondary { background: transparent; border-color: var(--line); color: var(--text); }
    button.danger { background: var(--danger); }
    section {
      background: color-mix(in srgb, var(--panel) 90%, black);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 1rem 1.1rem;
      margin-bottom: 1.25rem;
    }
    section h2 { margin: 0 0 0.75rem; font-size: 1.05rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { text-align: left; padding: 0.45rem 0.35rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; }
    .tag {
      display: inline-block; padding: 0.1rem 0.4rem; border-radius: 4px;
      font-size: 0.75rem; background: #243247;
    }
    .tag.pending { color: var(--warn); }
    .tag.failed { color: var(--danger); }
    .tag.ok { color: var(--ok); }
    .actions { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .msg { color: var(--muted); font-size: 0.85rem; margin: 0.5rem 0; }
    .err { color: var(--danger); }
    pre {
      white-space: pre-wrap; word-break: break-word; background: #101820;
      padding: 0.75rem; border-radius: 6px; max-height: 320px; overflow: auto;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>运维管理</h1>
    <p>死信重放、隔离文档放行、审计检索与导出。Access Token 仅保存在本页内存中。</p>
  </header>
  <main>
    <div class="bar">
      <label>API Base
        <input id="base" value="" placeholder="留空=同源" style="width:12rem" />
      </label>
      <label>Username
        <input id="user" style="width:10rem" />
      </label>
      <label>Password
        <input id="pass" type="password" style="width:10rem" />
      </label>
      <button id="loginBtn" type="button">登录</button>
      <label>Workspace ID
        <input id="workspace" style="width:16rem" />
      </label>
      <span id="authMsg" class="msg"></span>
    </div>

    <section>
      <h2>死信队列</h2>
      <div class="bar">
        <button type="button" class="secondary" id="loadDlq">刷新</button>
      </div>
      <div id="dlqMsg" class="msg"></div>
      <table>
        <thead>
          <tr>
            <th>来源</th><th>任务</th><th>阶段</th><th>错误</th><th>状态</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="dlqBody"></tbody>
      </table>
    </section>

    <section>
      <h2>隔离区文档</h2>
      <div class="bar">
        <button type="button" class="secondary" id="loadQuarantine">刷新</button>
      </div>
      <div id="qMsg" class="msg"></div>
      <table>
        <thead>
          <tr><th>文件名</th><th>状态</th><th>版本</th><th>操作</th></tr>
        </thead>
        <tbody id="qBody"></tbody>
      </table>
    </section>

    <section>
      <h2>失败任务重新入队</h2>
      <div class="bar">
        <label>Document ID
          <input id="resumeDoc" style="width:16rem" />
        </label>
        <label>失败阶段（记录用）
          <select id="resumeStage">
            <option>parsing</option>
            <option>chunking</option>
            <option selected>embedding</option>
            <option>indexing</option>
          </select>
        </label>
        <button type="button" id="resumeBtn">重新入队</button>
      </div>
      <div class="msg">Worker 会重新解析/切片；流水线指纹一致时复用已提交的 Embedding checkpoint。</div>
      <div id="resumeMsg" class="msg"></div>
    </section>

    <section>
      <h2>审计日志</h2>
      <div class="bar">
        <label>Action filter
          <input id="auditAction" placeholder="document.upload" style="width:12rem" />
        </label>
        <button type="button" class="secondary" id="loadAudit">检索</button>
        <button type="button" class="secondary" id="exportAudit">导出 JSONL</button>
      </div>
      <div id="auditMsg" class="msg"></div>
      <pre id="auditOut"></pre>
    </section>
  </main>
  <script>
    let token = null;
    const $ = (id) => document.getElementById(id);
    const base = () => ($("base").value || "").replace(/\/$/, "");

    async function api(path, opts = {}) {
      const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
      if (token) headers["Authorization"] = `Bearer ${token}`;
      const res = await fetch(`${base()}${path}`, { ...opts, headers });
      if (!res.ok) {
        const text = await res.text();
        throw new Error(`${res.status}: ${text}`);
      }
      if (res.status === 204) return null;
      const ct = res.headers.get("content-type") || "";
      if (ct.includes("json")) return res.json();
      return res.text();
    }

    $("loginBtn").onclick = async () => {
      try {
        const data = await api("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({ username: $("user").value, password: $("pass").value }),
        });
        token = data.access_token;
        $("authMsg").textContent = "已登录";
        $("authMsg").classList.remove("err");
      } catch (e) {
        $("authMsg").textContent = e.message;
        $("authMsg").classList.add("err");
      }
    };

    $("loadDlq").onclick = async () => {
      const ws = $("workspace").value.trim();
      if (!ws) return ($("dlqMsg").textContent = "需要 Workspace ID");
      try {
        const rows = await api(`/api/admin/dead-letters?workspace_id=${encodeURIComponent(ws)}`);
        const body = $("dlqBody");
        body.innerHTML = "";
        for (const row of rows) {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${row.source}</td>
            <td>${row.task_name}<div class="msg">${row.document_id || ""}</div></td>
            <td>${row.failed_stage || "-"}</td>
            <td>${(row.error || "").slice(0, 120)}</td>
            <td><span class="tag pending">${row.status}</span></td>
            <td class="actions"></td>`;
          const actions = tr.querySelector(".actions");
          if (row.status === "pending") {
            const replay = document.createElement("button");
            replay.textContent = "重放";
            replay.onclick = async () => {
              await api(`/api/admin/dead-letters/${row.id}/replay`, {
                method: "POST",
                body: JSON.stringify({ from_stage: row.failed_stage || "embedding" }),
              });
              $("loadDlq").click();
            };
            const discard = document.createElement("button");
            discard.textContent = "丢弃";
            discard.className = "danger";
            discard.onclick = async () => {
              await api(`/api/admin/dead-letters/${row.id}/discard`, { method: "POST", body: "{}" });
              $("loadDlq").click();
            };
            actions.append(replay, discard);
          }
          body.appendChild(tr);
        }
        $("dlqMsg").textContent = `${rows.length} 条`;
      } catch (e) {
        $("dlqMsg").textContent = e.message;
        $("dlqMsg").classList.add("err");
      }
    };

    $("loadQuarantine").onclick = async () => {
      const ws = $("workspace").value.trim();
      if (!ws) return ($("qMsg").textContent = "需要 Workspace ID");
      try {
        const rows = await api(`/api/admin/quarantine?workspace_id=${encodeURIComponent(ws)}`);
        const body = $("qBody");
        body.innerHTML = "";
        for (const row of rows) {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${row.filename}<div class="msg">${row.id}</div></td>
            <td>${row.status}</td>
            <td>${row.active_index_version ?? "-"}</td>
            <td class="actions"></td>`;
          const btn = document.createElement("button");
          btn.textContent = "放行";
          btn.onclick = async () => {
            await api(`/api/admin/quarantine/${row.id}/release`, { method: "POST", body: "{}" });
            $("loadQuarantine").click();
          };
          tr.querySelector(".actions").appendChild(btn);
          body.appendChild(tr);
        }
        $("qMsg").textContent = `${rows.length} 条`;
      } catch (e) {
        $("qMsg").textContent = e.message;
        $("qMsg").classList.add("err");
      }
    };

    $("resumeBtn").onclick = async () => {
      try {
        const docId = $("resumeDoc").value.trim();
        const data = await api(`/api/admin/documents/${docId}/resume`, {
          method: "POST",
          body: JSON.stringify({ from_stage: $("resumeStage").value }),
        });
        $("resumeMsg").textContent = `已重新入队：${data.status} / ${data.stage}`;
        $("resumeMsg").classList.remove("err");
      } catch (e) {
        $("resumeMsg").textContent = e.message;
        $("resumeMsg").classList.add("err");
      }
    };

    $("loadAudit").onclick = async () => {
      const ws = $("workspace").value.trim();
      if (!ws) return ($("auditMsg").textContent = "需要 Workspace ID");
      try {
        let path = `/api/admin/audit-logs?workspace_id=${encodeURIComponent(ws)}&limit=50`;
        const action = $("auditAction").value.trim();
        if (action) path += `&action=${encodeURIComponent(action)}`;
        const rows = await api(path);
        $("auditOut").textContent = JSON.stringify(rows, null, 2);
        $("auditMsg").textContent = `${rows.length} 条`;
      } catch (e) {
        $("auditMsg").textContent = e.message;
        $("auditMsg").classList.add("err");
      }
    };

    $("exportAudit").onclick = async () => {
      const ws = $("workspace").value.trim();
      if (!ws) return;
      const res = await fetch(
        `${base()}/api/admin/audit-logs/export?workspace_id=${encodeURIComponent(ws)}`,
        { headers: { Authorization: `Bearer ${token}` } }
      );
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `audit-${ws}.jsonl`;
      a.click();
      URL.revokeObjectURL(url);
    };
  </script>
</body>
</html>
