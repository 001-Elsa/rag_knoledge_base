# CI：代码检查 + 单元测试 + 集成测试 + 离线检索质量门禁
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: ragpass
          POSTGRES_DB: ragdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d ragdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      minio:
        # Bitnami moved the archived image out of bitnami/minio. Pin the
        # multi-architecture legacy manifest so CI cannot silently drift.
        image: bitnamilegacy/minio:2024.12.18@sha256:c0ede65eb88e47138470202c517bacf55ab3c27df848030b7b46e69d34b7d192
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          MINIO_DEFAULT_BUCKETS: rag-ci
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://rag:ragpass@localhost:5432/ragdb
      REDIS_URL: redis://localhost:6379/0
      AUTO_CREATE_TABLES: "false"
      RUN_INTEGRATION: "1"
      RLS_DATABASE_URL: postgresql+psycopg://rag_app:rag_app_test@localhost:5432/ragdb
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      # MinIO is available for tests that opt in via STORAGE_BACKEND=s3.
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: rag-ci
      S3_SECURE: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Lint (ruff)
        run: ruff check app tests scripts

      - name: Create non-owner RLS test role
        env:
          PGPASSWORD: ragpass
        run: psql -h localhost -U rag -d ragdb -c "CREATE ROLE rag_app LOGIN PASSWORD 'rag_app_test'"

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Test (pytest)
        run: pytest -q --junitxml=pytest-results.xml

      - name: Report pytest failures
        if: failure()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("pytest-results.xml")
          if not report.exists():
              raise SystemExit("pytest did not produce a JUnit report")
          root = ET.parse(report).getroot()
          for case in root.iter("testcase"):
              failure = case.find("failure")
              if failure is None:
                  failure = case.find("error")
              if failure is None:
                  continue
              message = (failure.get("message") or failure.text or "pytest failure").strip()
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(
                  f"::error file={case.get('file', '')},line={case.get('line', '1')},"
                  f"title={case.get('classname', '')}.{case.get('name', '')}::{message[:1500]}"
              )
          PY

      - name: Offline retrieval quality gate
        run: python scripts/ci_eval_retrieval.py

      - name: Prompt-injection release gate
        run: python scripts/check_injection_gate.py

      - name: Validate reviewed golden-set schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows = [json.loads(x) for x in Path("eval/golden_set.jsonl").read_text().splitlines() if x.strip()]
          assert len(rows) >= 10
          required = {"id", "question", "reference_answer", "expected_documents", "expected_keywords", "answerable", "category"}
          assert all(required <= row.keys() for row in rows)
          assert len({row["id"] for row in rows}) == len(rows)
          PY

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: eval/reports/
          retention-days: 30

      - name: Verify audit hash chain (smoke)
        if: always()
        env:
          RUN_INTEGRATION: "0"  # use app's DB but skip other integration tests
        run: |
          python - <<'PY'
          # Smoke test: verify_audit_chain.py imports and the hash logic is self-consistent.
          import sys
          sys.path.insert(0, ".")
          from scripts.verify_audit_chain import verify_rows, _entry_hash

          # Synthetic row to ensure hash computation is deterministic.
          row = {
              "id": "test-001",
              "chain_seq": 1,
              "action": "test.action",
              "resource_type": "document",
              "resource_id": "doc-001",
              "actor_user_id": "user-001",
              "workspace_id": "ws-001",
              "outcome": "success",
              "before": None,
              "after": {"status": "ready"},
              "created_at": "2026-01-01T00:00:00+00:00",
          }
          h1 = _entry_hash("0" * 64, row)

          # Same inputs → same hash.
          assert h1 == _entry_hash("0" * 64, dict(row)), "hash must be deterministic"

          # Chain linking test: prev_hash becomes first component.
          h2 = _entry_hash(h1, {**row, "id": "test-002", "chain_seq": 2})
          assert h2 != h1

          # Verify full chain.
          failures = verify_rows([
              {**row, "prev_hash": "0" * 64, "entry_hash": h1},
              {**row, "id": "test-002", "chain_seq": 2, "prev_hash": h1, "entry_hash": h2},
          ])
          assert not failures, f"chain verification failed: {failures}"
          print(f"[PASS] audit hash chain smoke test ({h1[:12]}... → {h2[:12]}...)")
          PY

      - name: Gate check summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = Path("eval/reports/ci_hybrid.json")
          baseline = Path("eval/baseline.json")
          if report.exists():
              data = json.loads(report.read_text())
              print(f"CI hybrid: Hit@5={data['hit_rate_at_5']:.3f} MRR={data['mrr']:.3f} P95={data['p95_retrieval_ms']:.1f}ms")
          if baseline.exists():
              data = json.loads(baseline.read_text())
              print(f"Baseline:  Hit@5={data['hit_rate_at_5']:.3f} MRR={data['mrr']:.3f} P95={data['p95_retrieval_ms']:.1f}ms")
          PY
