# CI：代码检查 + 单元测试 + 集成测试 + 离线检索质量门禁
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: ragpass
          POSTGRES_DB: ragdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d ragdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      minio:
        image: bitnami/minio:2024.12.18
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          MINIO_DEFAULT_BUCKETS: rag-ci
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://rag:ragpass@localhost:5432/ragdb
      REDIS_URL: redis://localhost:6379/0
      AUTO_CREATE_TABLES: "false"
      RUN_INTEGRATION: "1"
      RLS_DATABASE_URL: postgresql+psycopg://rag_app:rag_app_test@localhost:5432/ragdb
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      # MinIO is available for tests that opt in via STORAGE_BACKEND=s3.
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: rag-ci
      S3_SECURE: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Lint (ruff)
        run: ruff check app tests scripts

      - name: Create non-owner RLS test role
        env:
          PGPASSWORD: ragpass
        run: psql -h localhost -U rag -d ragdb -c "CREATE ROLE rag_app LOGIN PASSWORD 'rag_app_test'"

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Test (pytest)
        run: pytest -q

      - name: Offline retrieval quality gate
        run: python scripts/ci_eval_retrieval.py

      - name: Prompt-injection release gate
        run: python scripts/check_injection_gate.py

      - name: Validate reviewed golden-set schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows = [json.loads(x) for x in Path("eval/golden_set.jsonl").read_text().splitlines() if x.strip()]
          assert len(rows) >= 10
          required = {"id", "question", "reference_answer", "expected_documents", "expected_keywords", "answerable", "category"}
          assert all(required <= row.keys() for row in rows)
          assert len({row["id"] for row in rows}) == len(rows)
          PY
