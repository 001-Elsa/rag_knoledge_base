# CI：代码检查 + 单元测试（push / PR 自动触发）
# 说明：CI 里用 requirements-ci.txt（不含 torch/sentence-transformers 等重依赖，
# 单测通过懒加载设计不需要它们），几十秒跑完。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: ragpass
          POSTGRES_DB: ragdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d ragdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rag:ragpass@localhost:5432/ragdb
      REDIS_URL: redis://localhost:6379/0
      AUTO_CREATE_TABLES: "false"
      RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Lint (ruff)
        run: ruff check app tests scripts

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Test (pytest)
        run: pytest -q
