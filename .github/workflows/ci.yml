# CI：代码检查 + 单元测试（push / PR 自动触发）
# 说明：CI 里用 requirements-ci.txt（不含 torch/sentence-transformers 等重依赖，
# 单测通过懒加载设计不需要它们），几十秒跑完。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Lint (ruff)
        run: ruff check app tests scripts

      - name: Test (pytest)
        run: pytest -q
