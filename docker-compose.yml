services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag_admin
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?请在 .env 中配置 DB_ADMIN_PASSWORD}
      POSTGRES_DB: ragdb
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?请在 .env 中配置 APP_DB_PASSWORD}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?请在 .env 中配置 WORKER_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-create-runtime-roles.sh:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_admin -d ragdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-rag-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?请在 .env 中配置 S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    # 先执行数据库迁移，再启动服务
    command: >-
      sh -c "DATABASE_URL=$${MIGRATION_DATABASE_URL} alembic upgrade head &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://rag_app:${APP_DB_PASSWORD}@postgres:5432/ragdb
      MIGRATION_DATABASE_URL: postgresql+psycopg://rag_admin:${DB_ADMIN_PASSWORD}@postgres:5432/ragdb
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_STORAGE_URL: redis://redis:6379/1
      AUTO_CREATE_TABLES: "false"   # 建表交给 Alembic
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rag-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: rag-documents
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SECURE: ${S3_SECURE:-false}
      LLM_API_KEY: ${LLM_API_KEY:?请在 .env 中配置 DeepSeek 的 LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
      LLM_INPUT_COST_PER_MILLION: ${LLM_INPUT_COST_PER_MILLION:-0}
      LLM_OUTPUT_COST_PER_MILLION: ${LLM_OUTPUT_COST_PER_MILLION:-0}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
      BREAKER_FAIL_THRESHOLD: ${BREAKER_FAIL_THRESHOLD:-5}
      BREAKER_COOLDOWN_SECONDS: ${BREAKER_COOLDOWN_SECONDS:-30}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-4}
      AGENT_MEMORY_ENABLED: ${AGENT_MEMORY_ENABLED:-true}
      AGENT_MEMORY_CANDIDATES: ${AGENT_MEMORY_CANDIDATES:-80}
      AGENT_MEMORY_MAX_ITEMS: ${AGENT_MEMORY_MAX_ITEMS:-6}
      AGENT_MEMORY_MAX_CHARS: ${AGENT_MEMORY_MAX_CHARS:-1800}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中配置 JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-rag_refresh}
      EXPOSE_REFRESH_TOKEN_IN_BODY: ${EXPOSE_REFRESH_TOKEN_IN_BODY:-false}
      WEBSOCKET_TICKET_TTL_SECONDS: ${WEBSOCKET_TICKET_TTL_SECONDS:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RATE_LIMIT_CHAT: ${RATE_LIMIT_CHAT:-20/minute}
      RATE_LIMIT_UPLOAD: ${RATE_LIMIT_UPLOAD:-10/minute}
      CHAT_GLOBAL_CONCURRENCY: ${CHAT_GLOBAL_CONCURRENCY:-32}
      CHAT_USER_CONCURRENCY: ${CHAT_USER_CONCURRENCY:-2}
      CHAT_SLOT_LEASE_SECONDS: ${CHAT_SLOT_LEASE_SECONDS:-600}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-40}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      WORKSPACE_STORAGE_QUOTA_MB: ${WORKSPACE_STORAGE_QUOTA_MB:-10240}
      ALLOWED_MIME_TYPES: ${ALLOWED_MIME_TYPES:-application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv,text/html,image/png,image/jpeg,image/webp,image/tiff,text/plain,text/markdown,text/x-markdown,application/octet-stream}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-chi_sim+eng}
      TABLE_EXTRACTION_ENABLED: ${TABLE_EXTRACTION_ENABLED:-true}
      EXTERNAL_SOURCE_ALLOWED_HOSTS: ${EXTERNAL_SOURCE_ALLOWED_HOSTS:-}
      EXTERNAL_SOURCE_TIMEOUT_SECONDS: ${EXTERNAL_SOURCE_TIMEOUT_SECONDS:-20}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-512}
      EMBEDDING_CACHE_SIZE: ${EMBEDDING_CACHE_SIZE:-10000}
      EMBEDDING_QUERY_INSTRUCTION: ${EMBEDDING_QUERY_INSTRUCTION:-为这个句子生成表示以用于检索相关文章：}
      CHUNK_SIZE: ${CHUNK_SIZE:-512}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-64}
      CHUNK_STRATEGY: ${CHUNK_STRATEGY:-recursive}
      SEMANTIC_CHUNK_THRESHOLD: ${SEMANTIC_CHUNK_THRESHOLD:-0.42}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-5}
      RETRIEVAL_CANDIDATES: ${RETRIEVAL_CANDIDATES:-30}
      RRF_K: ${RRF_K:-60}
      RERANK_ENABLED: ${RERANK_ENABLED:-false}
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-base}
      PARENT_CHILD_ENABLED: ${PARENT_CHILD_ENABLED:-true}
      GRAPH_RETRIEVAL_ENABLED: ${GRAPH_RETRIEVAL_ENABLED:-true}
      RULE_RERANK_ENABLED: ${RULE_RERANK_ENABLED:-true}
      LLM_RERANK_ENABLED: ${LLM_RERANK_ENABLED:-false}
      QUERY_REWRITE_ENABLED: ${QUERY_REWRITE_ENABLED:-true}
      SUGGESTIONS_ENABLED: ${SUGGESTIONS_ENABLED:-true}
      MULTI_QUERY_ENABLED: ${MULTI_QUERY_ENABLED:-false}
      QUERY_CLEAN_ENABLED: ${QUERY_CLEAN_ENABLED:-true}
      QUERY_EXPANSION_ENABLED: ${QUERY_EXPANSION_ENABLED:-true}
      HYDE_ENABLED: ${HYDE_ENABLED:-false}
      AUTO_ROUTE_ENABLED: ${AUTO_ROUTE_ENABLED:-true}
      QUERY_TERM_DICTIONARY: ${QUERY_TERM_DICTIONARY:-}
      HISTORY_MAX_TURNS: ${HISTORY_MAX_TURNS:-6}
      HISTORY_CACHE_TTL: ${HISTORY_CACHE_TTL:-3600}
      HISTORY_SUMMARY_ENABLED: ${HISTORY_SUMMARY_ENABLED:-true}
      SUMMARY_TRIGGER_MESSAGES: ${SUMMARY_TRIGGER_MESSAGES:-12}
      SUMMARY_KEEP_RECENT: ${SUMMARY_KEEP_RECENT:-6}
      SEMANTIC_CACHE_ENABLED: ${SEMANTIC_CACHE_ENABLED:-true}
      SEMANTIC_CACHE_THRESHOLD: ${SEMANTIC_CACHE_THRESHOLD:-0.95}
      SEMANTIC_CACHE_SIZE: ${SEMANTIC_CACHE_SIZE:-50}
      SEMANTIC_CACHE_TTL: ${SEMANTIC_CACHE_TTL:-86400}
      CONTEXT_MAX_TOKENS: ${CONTEXT_MAX_TOKENS:-6000}
      CONTEXT_COMPRESSION_ENABLED: ${CONTEXT_COMPRESSION_ENABLED:-true}
      CONTEXT_COMPRESSION_MIN_CHARS: ${CONTEXT_COMPRESSION_MIN_CHARS:-900}
      LOST_IN_MIDDLE_ENABLED: ${LOST_IN_MIDDLE_ENABLED:-true}
      EVIDENCE_MIN_CHUNKS: ${EVIDENCE_MIN_CHUNKS:-1}
      EVIDENCE_MIN_RRF_SCORE: ${EVIDENCE_MIN_RRF_SCORE:-0.012}
      PROMPT_INJECTION_DETECTION_ENABLED: ${PROMPT_INJECTION_DETECTION_ENABLED:-true}
      CITATION_ENTAILMENT_ENABLED: ${CITATION_ENTAILMENT_ENABLED:-false}
      CITATION_ENTAILMENT_MAX_CLAIMS: ${CITATION_ENTAILMENT_MAX_CLAIMS:-6}
      CITATION_ENTAILMENT_FAIL_CLOSED: ${CITATION_ENTAILMENT_FAIL_CLOSED:-false}
      INJECTION_HIGH_RISK_ACTION: ${INJECTION_HIGH_RISK_ACTION:-downweight}
      INJECTION_DOWNWEIGHT_FACTOR: ${INJECTION_DOWNWEIGHT_FACTOR:-0.3}
      PII_REDACTION_ENABLED: ${PII_REDACTION_ENABLED:-true}
      INJECTION_QUARANTINE_ENABLED: ${INJECTION_QUARANTINE_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: rag-api
    volumes:
      - staging:/srv/uploads
      - hf_cache:/home/app/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build: .
    command: python scripts/run_worker.py
    environment:
      DATABASE_URL: postgresql+psycopg://rag_worker:${WORKER_DB_PASSWORD}@postgres:5432/ragdb
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rag-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: rag-documents
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SECURE: ${S3_SECURE:-false}
      LLM_API_KEY: ${LLM_API_KEY:-unused-by-worker}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-512}
      CHUNK_SIZE: ${CHUNK_SIZE:-512}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-64}
      CHUNK_STRATEGY: ${CHUNK_STRATEGY:-recursive}
      SEMANTIC_CHUNK_THRESHOLD: ${SEMANTIC_CHUNK_THRESHOLD:-0.42}
      MAX_DOCUMENT_PAGES: ${MAX_DOCUMENT_PAGES:-500}
      MAX_UNCOMPRESSED_MB: ${MAX_UNCOMPRESSED_MB:-100}
      INJECTION_QUARANTINE_ENABLED: ${INJECTION_QUARANTINE_ENABLED:-false}
      INJECTION_QUARANTINE_RATIO: ${INJECTION_QUARANTINE_RATIO:-0.5}
      INJECTION_LLM_CHECK_ENABLED: ${INJECTION_LLM_CHECK_ENABLED:-false}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-chi_sim+eng}
      TABLE_EXTRACTION_ENABLED: ${TABLE_EXTRACTION_ENABLED:-true}
      GRAPH_RETRIEVAL_ENABLED: ${GRAPH_RETRIEVAL_ENABLED:-true}
      PROMPT_INJECTION_DETECTION_ENABLED: ${PROMPT_INJECTION_DETECTION_ENABLED:-true}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      OUTBOX_MAX_RETRIES: ${OUTBOX_MAX_RETRIES:-12}
      OUTBOX_BASE_RETRY_SECONDS: ${OUTBOX_BASE_RETRY_SECONDS:-2}
      ORPHAN_OBJECT_GRACE_SECONDS: ${ORPHAN_OBJECT_GRACE_SECONDS:-86400}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      AUDIT_ARCHIVE_BEFORE_PURGE: ${AUDIT_ARCHIVE_BEFORE_PURGE:-true}
      INGESTION_EMBED_BATCH_SIZE: ${INGESTION_EMBED_BATCH_SIZE:-64}
      RESOURCE_DELETE_MAX_RETRIES: ${RESOURCE_DELETE_MAX_RETRIES:-8}
      INGESTION_SOFT_TIME_LIMIT_SECONDS: ${INGESTION_SOFT_TIME_LIMIT_SECONDS:-1500}
      INGESTION_HARD_TIME_LIMIT_SECONDS: ${INGESTION_HARD_TIME_LIMIT_SECONDS:-1800}
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9101}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-10}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: rag-worker
    volumes:
      - staging:/srv/uploads
      - hf_cache:/home/app/.cache
    expose:
      - "9101"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  beat:
    build: .
    command: celery -A app.tasks beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg://rag_worker:${WORKER_DB_PASSWORD}@postgres:5432/ragdb
      REDIS_URL: redis://redis:6379/0
      LLM_API_KEY: unused-by-beat
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery 监控面板：http://localhost:5555
  flower:
    profiles: ["ops"]
    build: .
    command: celery -A app.tasks flower --port=5555
    ports:
      - "127.0.0.1:5555:5555"
    environment:
      REDIS_URL: redis://redis:6379/0
      LLM_API_KEY: ${LLM_API_KEY:-unused-by-flower}
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:?请在 .env 中配置 FLOWER_BASIC_AUTH}
    depends_on:
      redis:
        condition: service_healthy

  # ---- 可选：监控（docker compose --profile monitoring up -d）----
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/slo-recording.yml:/etc/prometheus/slo-recording.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?请在 .env 中配置 GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - tempo

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    profiles: ["monitoring"]
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./monitoring/otel-collector.yml:/etc/otelcol/config.yml:ro
    expose:
      - "4318"
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.6.1
    profiles: ["monitoring"]
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./monitoring/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    expose:
      - "3200"
      - "4318"

  # ---- 可选：对外发布（docker compose --profile edge up -d，配 DOMAIN 自动 HTTPS）----
  caddy:
    image: caddy:2-alpine
    profiles: ["edge"]
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api

volumes:
  pgdata:
  minio_data:
  staging:
  hf_cache:
  caddy_data:
  tempo_data:
