services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ragpass
      POSTGRES_DB: ragdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    # 先执行数据库迁移，再启动服务
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://rag:ragpass@postgres:5432/ragdb
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_STORAGE_URL: redis://redis:6379/1
      AUTO_CREATE_TABLES: "false"   # 建表交给 Alembic
      LLM_API_KEY: ${LLM_API_KEY:?请在 .env 中配置 DeepSeek 的 LLM_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    volumes:
      - uploads:/srv/uploads
      - hf_cache:/root/.cache   # 缓存 bge 模型，重启不用重新下载
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build: .
    command: celery -A app.tasks worker --loglevel=info --concurrency=1
    environment:
      DATABASE_URL: postgresql+psycopg://rag:ragpass@postgres:5432/ragdb
      REDIS_URL: redis://redis:6379/0
      LLM_API_KEY: ${LLM_API_KEY:-unused-by-worker}
    volumes:
      - uploads:/srv/uploads
      - hf_cache:/root/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery 监控面板：http://localhost:5555
  flower:
    build: .
    command: celery -A app.tasks flower --port=5555
    ports:
      - "5555:5555"
    environment:
      REDIS_URL: redis://redis:6379/0
      LLM_API_KEY: ${LLM_API_KEY:-unused-by-flower}
    depends_on:
      redis:
        condition: service_healthy

  # ---- 可选：监控（docker compose --profile monitoring up -d）----
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # ---- 可选：对外发布（docker compose --profile edge up -d，配 DOMAIN 自动 HTTPS）----
  caddy:
    image: caddy:2-alpine
    profiles: ["edge"]
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
  hf_cache:
  caddy_data:
