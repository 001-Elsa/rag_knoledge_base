global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/slo-recording.yml

scrape_configs:
  - job_name: rag-api
    static_configs:
      - targets: ["api:8000"]
  - job_name: rag-worker
    static_configs:
      - targets: ["worker:9101"]
