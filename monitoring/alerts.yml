groups:
  - name: rag-slo
    rules:
      - alert: RagApiHighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_requests_total[5m])), 0.001)
          > 0.01
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "RAG API 5xx 比例超过 1%"

      - alert: RagFirstTokenP95Slow
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(llm_first_token_seconds_bucket[10m]))) > 5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "首 Token P95 超过 5 秒"

      - alert: RagOutboxBacklog
        expr: outbox_pending_events > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outbox 待投递事件超过 100"

      - alert: RagIngestionFailures
        expr: increase(ingestion_failure_total[15m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "15 分钟内文档入库失败超过 5 次"

      - alert: RagAvailabilityBudgetBurnFast
        expr: rag:availability_burn_rate_1h > 14
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "可用性错误预算 1h 燃烧率过高（>14x）"

      - alert: RagAvailabilityBudgetLow
        expr: rag:availability_error_budget_remaining_30d < 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "30 天可用性错误预算剩余不足 20%"

      - alert: RagDeadLetterBacklog
        expr: increase(dead_letter_tasks_total[1h]) > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "1 小时内进入死信队列的任务超过 3 个"
